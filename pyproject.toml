[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pavvis"
version = "0.1.0"
description = "Visualisation tools for gene Presence/Absence Variation (PAV) matrix data"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "plotly",
    "umap-learn",
]

[project.optional-dependencies]
dev = ["pytest"]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

[tool.hatch.build.targets.wheel]
packages = ["pavvis"]