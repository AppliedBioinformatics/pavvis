[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pavvis"
version = "0.1.0"
description = "Visualisation tools for gene Presence/Absence Variation (PAV) matrix data"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jack Bruton", email = "jack.bruton@uwa.edu.au" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "plotly",
    "scipy",
    "umap-learn",
]

[project.optional-dependencies]
dev = ["pytest"]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/AppliedBioinformatics/pavvis"

[tool.hatch.build.targets.wheel]
packages = ["pavvis"]

[tool.hatch.build.targets.sdist]
include = ["pavvis", "tests", "README.md", "LICENSE", "pyproject.toml"]